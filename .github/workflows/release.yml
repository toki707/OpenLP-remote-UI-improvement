name: Publish OpenLP UI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows Installer EXE and Release Archives
        shell: pwsh
        run: |
          $ico = (Get-ChildItem -Recurse resources -Filter "OpenLP.ico" | Select-Object -First 1).FullName
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:"OpenLP-Remote-UI-Setup.exe" /win32icon:"$ico" /resource:"openlp\core\api\remote_client\index.html,index.html" /resource:"openlp\core\api\remote_client\assets\version.js,version.js" /resource:"scripts\remoteenhancementsplugin.py,remoteenhancementsplugin.py" "scripts\OpenLPUISetup.cs"

          New-Item -ItemType Directory -Force -Path "release_pkg\openlp\core\api\remote_client\assets" | Out-Null
          New-Item -ItemType Directory -Force -Path "release_pkg\scripts" | Out-Null
          Copy-Item "OpenLP-Remote-UI-Setup.exe" "release_pkg\OpenLP-Remote-UI-Setup.exe"
          Copy-Item "openlp\core\api\remote_client\index.html" "release_pkg\openlp\core\api\remote_client\index.html"
          Copy-Item "openlp\core\api\remote_client\assets\version.js" "release_pkg\openlp\core\api\remote_client\assets\version.js"
          Copy-Item "scripts\remoteenhancementsplugin.py" "release_pkg\scripts\remoteenhancementsplugin.py"
          Copy-Item "install_custom_ui.bat" "release_pkg\install_custom_ui.bat"
          Copy-Item "LICENSE" "release_pkg\LICENSE"

          Compress-Archive -Path "openlp\core\api\remote_client\*" -DestinationPath "remote.zip" -Force
          Compress-Archive -Path "release_pkg\*" -DestinationPath "OpenLP-Remote-and-PC-UI.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenLP Remote Apple HIG & Liquid Glass UI (${{ github.ref_name }})"
          body: |
            ## Nouveautés de cette version — Édition Apple HIG (iOS 18 & macOS Sequoia) & Liquid Glass (Licence GNU GPL v3)
            
            ### Installation en 1 clic sur Windows (`.exe`)
            Téléchargez et lancez **`OpenLP-Remote-UI-Setup.exe`** ci-dessous, puis cliquez sur **« Installer et Lancer OpenLP »**.

            ### 1. Télécommande Web Remote — Design Apple HIG & Liquid Glass
            - **Barre de navigation en pilule (`border-radius: 999px`)** sur mobile avec curseur glissant continu pour les 5 sections (*Service*, *Bible*, *Images*, *Diapos*, *Thèmes*).
            - **Système matériel Liquid Glass (couches 3 à 5)** : barre supérieure mobile, dock flottant en capsule (`‹ Élément ›`, `∧ Diapo ∨`, `Écran`), popover *Sortie du projecteur* et notifications toast, avec replis solides (`@supports` et `prefers-reduced-transparency`).
            - **Architecture Bureau macOS Sequoia (`>= 900 px`)** : barre latérale translucide à gauche + barre d'outils unifiée en haut intégrant le sélecteur de sortie du projecteur (*Noir | Thème | Bureau | Afficher*).
            - **Double moniteur permanent 16:9** : **Aperçu** + **Direct** (avec badge et anneau rouge) + bouton *Envoyer*.
            - **Import direct depuis la galerie du téléphone**, sélecteur biblique, éditeur de diapos perso et thèmes de salle.
            - **Thème Clair (#F2F2F7 / #FFFFFF) par défaut & Mode Sombre OLED (#000000 / #1C1C1E)**.

            ### 2. Interface PC (« Mode Simplifié / Jeunes »)
            - **Barre supérieure d'accès rapide** : accès en 1 clic à *Bible*, *Images & Affiches*, *Diapos perso* et *Chants*.
            - **Mode Simplifié (Jeunes)** : masque les panneaux complexes inutilisés tout en conservant le bouton d'envoi **Direct** dans chaque onglet.
            - **Bascule Thème Noir / Blanc** en direct sur PC.
          files: |
            OpenLP-Remote-UI-Setup.exe
            OpenLP-Remote-and-PC-UI.zip
            remote.zip
          draft: false
          prerelease: false
